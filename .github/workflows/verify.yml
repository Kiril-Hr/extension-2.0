name: DevEx verification

on:
  pull_request:
  push:
    branches: ['codex/**', master, main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: devxtension
      - run: node --test tests/registry-propagation.cjs
      - run: node tests/factory-product.cjs
      - run: node tests/packaging-cleanup.cjs
      - run: node tests/factory-watch.cjs
      - run: npm install --prefix .verification/tools --no-audit --no-fund playwright@1.56.1
      - run: node .verification/tools/node_modules/playwright/cli.js install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.verification/browser-binaries
      - name: Release HTTP port on the disposable Windows runner
        shell: pwsh
        run: |
          Stop-Service -Name W3SVC -Force -ErrorAction SilentlyContinue
          Stop-Service -Name HTTP -Force -ErrorAction Stop
      - run: node tests/factory-browser.cjs
        env:
          DEVEX_PLAYWRIGHT_PATH: ${{ github.workspace }}/.verification/tools/node_modules/playwright
      - name: Build the documented minimal example from public npm
        shell: pwsh
        run: |
          Copy-Item examples/minimal/.env.example examples/minimal/.env
          npm ci --prefix examples/minimal --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix examples/minimal run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix examples/minimal run build
          exit $LASTEXITCODE
      - run: node tests/minimal-example-browser.cjs
        env:
          DEVEX_PLAYWRIGHT_PATH: ${{ github.workspace }}/.verification/tools/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devex-verification
          path: |
            reports/factory-api-audit-2026-10-30/
            reports/cleanup-2026-11-16/
